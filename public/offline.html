<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f8f8f8">
    <title>Geen verbinding - Cyclear</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            box-sizing: border-box;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            color: #333;
            background: #fff;
            text-align: center;
        }
        img {
            width: 96px;
            height: 96px;
        }
        h1 {
            font-size: 22px;
            margin: 16px 0 8px;
        }
        p {
            margin: 0 0 20px;
            line-height: 1.5;
        }
        button {
            font: inherit;
            padding: 8px 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #fff;
            cursor: pointer;
        }
    </style>
</head>
<body>
<main>
    <img src="/icons/logo.svg" alt="">
    <h1>Geen verbinding</h1>
    <p>Cyclear kan nu niet geladen worden. Probeer het opnieuw zodra je weer online bent.</p>
    <button type="button" onclick="location.reload()">Opnieuw proberen</button>
</main>
</body>
</html>
